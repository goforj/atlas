schema_version: 1
capabilities:
  - id: architecture.cancellation
    area: architecture
    summary: Propagate cancellation across application and infrastructure boundaries.
    tier: smoke
    evaluations: [add-outbound-http-integration, add-upload-workflow]
  - id: architecture.dependency-injection
    area: architecture
    summary: Register application-owned services and repair missing providers through Wire.
    tier: smoke
    evaluations: [build-json-api-feature, repair-wire-provider]
  - id: architecture.flat-packages
    area: architecture
    summary: Keep cohesive application behavior in flat, self-contained Go packages.
    tier: core
    evaluations: [build-json-api-feature]
  - id: architecture.repository-boundary
    area: architecture
    summary: Keep persistence access behind repositories and application services.
    tier: smoke
    evaluations: [add-cached-repository, add-database-transaction]
  - id: architecture.structured-results
    area: architecture
    summary: Prefer a result type when application behavior needs several related return values.
    tier: extended
    evaluations: []
  - id: async.event-followup-job
    area: async
    summary: Convert an event reaction into durable typed follow-up work.
    tier: core
    evaluations: [dispatch-event-followup-job]
  - id: async.events
    area: async
    summary: Publish typed domain events and invoke registered reactions.
    tier: smoke
    evaluations: [add-event-subscriber, publish-domain-event]
