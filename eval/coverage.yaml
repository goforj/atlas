    evaluations: []
  - id: operations.diagnostics
    area: operations
    summary: Use Lighthouse and framework inspection to diagnose a runtime failure.
    tier: core
    evaluations: [runtime-observability]
  - id: operations.logging-metrics
    area: operations
    summary: Preserve useful structured logs and application metrics while repairing observability.
    tier: core
    evaluations: [runtime-observability]
